; First prototype nrf52840/sx1262 device
[env:weather_friend_2_rev_A]
extends = nrf52840_base
board = heltec_mesh_node_t114
debug_tool = jlink

# add -DCFG_SYSVIEW if you want to use the Segger systemview tool for OS profiling.
build_flags = ${nrf52840_base.build_flags} -Ivariants/weather_friend_2_rev_A
        -L "${platformio.libdeps_dir}/${this.__env__}/bsec2/src/cortex-m4/fpv4-sp-d16-hard"
        -DGPS_POWER_TOGGLE
        -DPRIVATE_HW

build_src_filter = ${nrf52_base.build_src_filter} +<../variants/weather_friend_2_rev_A> 
lib_deps = 
  ${nrf52840_base.lib_deps}
  lewisxhe/PCF8563_Library@^1.0.1
